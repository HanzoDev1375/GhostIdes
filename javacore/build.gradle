plugins {
    id 'com.android.library'
}

android {
    compileSdk = 36
    namespace = 'ir.hanzodev1375.ghostide.javacore'

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
    resources {
        excludes += [
            "META-INF/*.RSA", "META-INF/*.SF", "META-INF/*.DSA",
            "META-INF/eclipse.inf", "META-INF/ECLIPSE_.*",
            "plugin.xml", "plugin.properties", "fragment.xml", "fragment.properties",
            "about.html", "about.ini", "about.properties", "about.mappings", "about_files/**",
            "systembundle.properties", "profile.list", "**/*.profile", ".api_description",
            "**/*.api_description", ".options", "OSGI-INF/**", "OSGI-OPT/**",
            "*.html", "modeling32.png", "eclipse32.png", "eclipse32.gif", "eclipse_lg.png",
            "notice.html", "epl-v10.html", "license.html",
            "META-INF/AL2.0", "META-INF/LGPL2.1", "META-INF/LICENSE",
            "META-INF/DEPENDENCIES"
        ]
        pickFirsts += ["META-INF/MANIFEST.MF"]
    }
  }
}

dependencies {
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:1.0.0'

    // The exact Eclipse JDT stack CodeAssist bundles to run Java analysis in-process.
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.40.0'
    implementation 'org.eclipse.platform:org.eclipse.core.contenttype:3.9.600'
    implementation 'org.eclipse.platform:org.eclipse.core.jobs:3.15.400'
}
