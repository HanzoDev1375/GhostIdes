[versions]
agp = "8.13.0"
kotlin = "2.1.0"
coreKtx = "1.6.0"
appcompat = "1.8.0-alpha01"
material = "1.14.0"
guava = "33.2.1-android"
constraintlayout = "2.2.1"
# Editor
soraEditorVersion = "0.24.6"
# Gson 
gsonversion = "2.14.0"
swiperefreshlayout = "1.1.0"
recyclerviewSelection = "1.1.0"
shizuku = "13.1.5"
#glide
glide = "5.0.7"
#okhttps
okhttp = "5.3.2"
#Android util code 
utilcodev = "1.31.1"
#antlr4
antlrv = "4.13.2"
#powermenu
powermenu = "2.2.4"
#git
jgit = "6.7.0.202309050840-r"
#svg loader
svg = "1.4"
#zip4j
zip = "2.11.6"
#jsoup
jsoup = "1.22.2"
markwon = "4.6.2"
sshj = "0.38.0"
commons-net = "3.10.0"
#palette
palette = "1.0.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Use the new version reference
other-sora-editor-code = { group = "io.github.rosemoe", name = "editor", version.ref = "soraEditorVersion" }
other-sora-editor-lsp = { group = "io.github.rosemoe", name = "editor-lsp", version.ref = "soraEditorVersion" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gsonversion" }
utilcode = { group = "com.blankj", name = "utilcodex",version.ref = "utilcodev" }
antlr = { group = "org.antlr", name = "antlr4",version.ref = "antlrv" }
powermenu = { group = "com.github.skydoves", name = "powermenu", version.ref = "powermenu" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
glide-avif-integration = { module = "com.github.bumptech.glide:avif-integration", version.ref = "glide" }
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-recyclerview-selection = { module = "androidx.recyclerview:recyclerview-selection", version.ref = "recyclerviewSelection" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidsvg = { module = "com.caverock:androidsvg", version.ref = "svg"}
zip4j = {module = "net.lingala.zip4j:zip4j",version.ref = "zip"}

# Markwon
markwon-core = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
markwon-ext-strikethrough = { group = "io.noties.markwon", name = "ext-strikethrough", version.ref = "markwon" }
markwon-linkify = { group = "io.noties.markwon", name = "linkify", version.ref = "markwon" }
markwon-recycler = { group = "io.noties.markwon", name = "recycler", version.ref = "markwon" }
markwon-html = { group = "io.noties.markwon", name = "html", version.ref = "markwon" }
markwon-ext-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-ext-tasklist = { group = "io.noties.markwon", name = "ext-tasklist", version.ref = "markwon" }
markwon-image = { group = "io.noties.markwon", name = "image", version.ref = "markwon" }
markwon-syntax-highlight = { group = "io.noties.markwon", name = "syntax-highlight", version.ref = "markwon" }
#ftp 
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }